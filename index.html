<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101311" />
    <meta name="description" content="ゲノム解析学を学んで、挑んで、強くなる。マッチング対戦・一人学習・AI対戦・友だちとの対戦室。" />
    <meta property="og:title" content="ゲノム対戦" />
    <meta property="og:description" content="過去問100問で知識を磨く。マッチング対戦、一人学習、AI対戦、対戦室の4モード。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%A7%AC%3C/text%3E%3C/svg%3E" />
    <script>
      // 初回は元の黒。保存済みテーマを初回描画前に適用して明暗のちらつきを防ぐ。
      try {
        const theme = localStorage.getItem('gb.theme') === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f6f7ef' : '#101311';
      } catch { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <title>ゲノム対戦</title>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
